<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jerem, le mec qu’on accuse de tout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      padding: 20px;
      max-width: 800px;
      margin: auto;
      transition: background 0.3s, color 0.3s;
    }

    .light {
      background: #f4f4f4;
      color: #222;
    }

    h1 {
      text-align: center;
      color: #e53935;
      font-size: 2.5em;
      margin-bottom: 0;
    }

    h2 {
      text-align: center;
      color: #bbb;
      margin-top: 5px;
      margin-bottom: 30px;
    }

    #form, #reasons {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      margin-bottom: 30px;
      transition: background 0.3s;
    }

    .light #form, .light #reasons {
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .reason {
      padding: 10px;
      border-bottom: 1px solid #444;
    }

    .light .reason {
      border-bottom: 1px solid #ddd;
    }

    .reason:last-child {
      border-bottom: none;
    }

    button {
      background: #e53935;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 1em;
    }

    button:hover {
      background: #b71c1c;
    }

    #toggleDark {
      float: right;
      margin-top: -60px;
      background: #444;
    }

    .light #toggleDark {
      background: #ccc;
      color: #222;
    }

    #gloves {
      text-align: center;
      margin-bottom: 20px;
    }

    #gloves img {
      width: 120px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <button id="toggleDark" onclick="toggleDark()">Mode sombre</button>

  <div id="gloves">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Boxing_gloves_icon.svg/512px-Boxing_gloves_icon.svg.png">
  </div>

  <h1>Jerem, le mec qu’on accuse de tout</h1>
  <h2>Coupable officiel du club de chinron</h2>

  <div id="form">
    <h3>Ajouter une nouvelle accusation</h3>
    <input id="input" type="text" placeholder="Ex : Le ring a penché..." style="width:100%; padding:10px;">
    <button onclick="addReason()">Ajouter</button>
  </div>

  <div id="reasons">
    <h3>Liste officielle des accusations (<span id="count"></span>)</h3>
    <div id="list"></div>
  </div>

  <script>
    const BIN_ID = "6a9bd566f5f4af5e296d1e27";

    async function loadReasons() {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`);
      const data = await res.json();
      const reasons = data.record.reasons;

      const list = document.getElementById("list");
      const count = document.getElementById("count");
      list.innerHTML = "";
      count.textContent = reasons.length;

      reasons.forEach(r => {
        const div = document.createElement("div");
        div.className = "reason";
        div.textContent = r;
        list.appendChild(div);
      });
    }

    async function addReason() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`);
      const data = await res.json();
      const reasons = data.record.reasons;

      reasons.push(text + " → c’est Jerem.");

      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reasons })
      });

      input.value = "";
      loadReasons();
    }

    function toggleDark() {
      document.body.classList.toggle("light");
    }

    loadReasons();
  </script>

</body>
</html>
